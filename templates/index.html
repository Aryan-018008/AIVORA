<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aivora — AI Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script>
        tailwind.config = {
            darkMode: "class"
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-950 transition-colors duration-300">

<div class="flex h-screen overflow-hidden">

    <!-- MOBILE OVERLAY -->
    <div
        id="sidebarOverlay"
        onclick="toggleSidebar()"
        class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"
    ></div>


    <!-- ================= SIDEBAR ================= -->

    <aside
        id="sidebar"
        class="fixed lg:relative z-50
               w-72 max-w-[85vw]
               h-full
               bg-white dark:bg-gray-900
               border-r border-gray-200 dark:border-gray-800
               flex flex-col
               transform -translate-x-full lg:translate-x-0
               transition-transform duration-300"
    >

        <!-- Logo -->

        <div class="p-5 border-b border-gray-200 dark:border-gray-800">

            <div class="flex items-center justify-between">

                <div class="flex items-center gap-3">

                    <div
                        class="w-11 h-11 rounded-xl
                               bg-blue-600 text-white
                               flex items-center justify-center
                               shadow-lg"
                    >
                        <i class="fa-solid fa-robot text-xl"></i>
                    </div>

                    <div>

                        <h1 class="font-bold text-lg
                                   text-gray-900 dark:text-white">
                            Aivora
                        </h1>

                        <p class="text-xs text-gray-500">
                            AI Assistant
                        </p>

                    </div>

                </div>


                <!-- Mobile close -->

                <button
                    onclick="toggleSidebar()"
                    class="lg:hidden w-9 h-9
                           rounded-lg
                           hover:bg-gray-100
                           dark:hover:bg-gray-800
                           text-gray-500"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

        </div>


        <!-- New Chat -->

        <div class="p-4">

            <button
                onclick="clearChat(); closeSidebarOnMobile()"
                class="w-full flex items-center justify-center gap-2
                       bg-blue-600 hover:bg-blue-700
                       text-white py-3 rounded-xl
                       transition shadow-md"
            >

                <i class="fa-solid fa-plus"></i>

                New Chat

            </button>

        </div>


        <!-- Chat History -->

        <div class="flex-1 px-4 overflow-y-auto">

            <p
                class="text-xs font-semibold
                       text-gray-400 uppercase mb-3"
            >
                Recent Chats
            </p>


            <button
                class="w-full text-left p-3 rounded-lg
                       hover:bg-gray-100
                       dark:hover:bg-gray-800
                       text-gray-700
                       dark:text-gray-300
                       text-sm
                       flex items-center gap-3"
            >

                <i class="fa-regular fa-message"></i>

                Current Conversation

            </button>

        </div>


        <!-- Bottom -->

        <div
            class="p-4
                   border-t
                   border-gray-200
                   dark:border-gray-800"
        >

            <button
                onclick="toggleTheme()"
                class="w-full flex items-center gap-3
                       p-3 rounded-lg
                       hover:bg-gray-100
                       dark:hover:bg-gray-800
                       text-gray-700
                       dark:text-gray-300"
            >

                <i
                    id="themeIcon"
                    class="fa-solid fa-moon"
                ></i>

                <span id="themeText">
                    Dark Mode
                </span>

            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="flex-1 flex flex-col min-w-0 w-full">


        <!-- HEADER -->

        <header
            class="h-16 shrink-0
                   bg-white dark:bg-gray-900
                   border-b
                   border-gray-200
                   dark:border-gray-800
                   flex items-center
                   justify-between
                   px-3 sm:px-5"
        >

            <div class="flex items-center gap-3">

                <!-- Mobile Menu -->

                <button
                    onclick="toggleSidebar()"
                    class="lg:hidden
                           w-10 h-10
                           rounded-lg
                           hover:bg-gray-100
                           dark:hover:bg-gray-800
                           text-gray-600
                           dark:text-gray-300"
                >

                    <i class="fa-solid fa-bars text-xl"></i>

                </button>


                <div>

                    <h2
                        class="font-semibold
                               text-gray-900
                               dark:text-white"
                    >
                        Aivora
                    </h2>

                    <div class="flex items-center gap-2">

                        <span
                            class="w-2 h-2
                                   bg-green-500
                                   rounded-full"
                        ></span>

                        <span class="text-xs text-gray-500">
                            Online
                        </span>

                    </div>

                </div>

            </div>


            <!-- Clear button -->

            <button
                onclick="clearChat()"
                title="Clear chat"
                class="w-10 h-10
                       rounded-lg
                       hover:bg-gray-100
                       dark:hover:bg-gray-800
                       text-gray-600
                       dark:text-gray-300"
            >

                <i class="fa-solid fa-trash"></i>

            </button>

        </header>


        <!-- ================= CHAT AREA ================= -->

        <section
            id="chatContainer"
            class="flex-1
                   overflow-y-auto
                   px-3 sm:px-5
                   py-4 sm:py-6"
        >

            <!-- Welcome -->

            <div
                id="welcomeScreen"
                class="max-w-3xl
                       mx-auto
                       flex flex-col
                       items-center
                       justify-center
                       min-h-full
                       text-center
                       py-8"
            >

                <div
                    class="w-16 h-16
                           sm:w-20 sm:h-20
                           rounded-3xl
                           bg-blue-600
                           text-white
                           flex items-center
                           justify-center
                           shadow-xl
                           mb-5 sm:mb-6"
                >

                    <i
                        class="fa-solid fa-robot
                               text-3xl sm:text-4xl"
                    ></i>

                </div>


                <h1
                    class="text-2xl
                           sm:text-3xl
                           md:text-4xl
                           font-bold
                           text-gray-900
                           dark:text-white
                           mb-3"
                >
                    How can I help you?
                </h1>


                <p
                    class="text-sm
                           sm:text-base
                           text-gray-500
                           dark:text-gray-400
                           max-w-lg
                           px-3"
                >
                    Ask me anything. I can help you with
                    coding, learning, ideas, explanations
                    and much more.
                </p>


                <!-- Suggestions -->

                <div
                    class="grid
                           grid-cols-1
                           sm:grid-cols-2
                           gap-3
                           mt-7
                           w-full
                           max-w-xl"
                >

                    <button
                        onclick="useSuggestion('Explain Python functions')"
                        class="suggestion"
                    >
                        <i class="fa-solid fa-code"></i>

                        <span>
                            Explain Python functions
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Give me a coding challenge')"
                        class="suggestion"
                    >
                        <i class="fa-solid fa-terminal"></i>

                        <span>
                            Give me a coding challenge
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Explain artificial intelligence')"
                        class="suggestion"
                    >
                        <i class="fa-solid fa-brain"></i>

                        <span>
                            Explain AI
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Help me build a project')"
                        class="suggestion"
                    >
                        <i class="fa-solid fa-lightbulb"></i>

                        <span>
                            Help me build a project
                        </span>

                    </button>

                </div>

            </div>


            <!-- Messages -->

            <div
                id="messages"
                class="max-w-4xl
                       mx-auto
                       space-y-5 sm:space-y-6
                       hidden"
            ></div>

        </section>


        <!-- ================= INPUT ================= -->

        <footer
            class="shrink-0
                   p-2 sm:p-4
                   bg-gray-100
                   dark:bg-gray-950"
        >

            <div class="max-w-4xl mx-auto">

                <div
                    class="relative
                           bg-white
                           dark:bg-gray-900
                           border
                           border-gray-300
                           dark:border-gray-700
                           rounded-2xl
                           shadow-lg
                           focus-within:border-blue-500
                           transition"
                >

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message Aivora..."
                        class="w-full
                               resize-none
                               bg-transparent
                               text-gray-900
                               dark:text-white
                               placeholder-gray-400
                               outline-none
                               px-4 sm:px-5
                               py-3.5 sm:py-4
                               pr-14
                               max-h-40
                               text-sm sm:text-base"
                    ></textarea>


                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                        class="absolute
                               right-2
                               bottom-2
                               w-10 h-10
                               rounded-xl
                               bg-blue-600
                               hover:bg-blue-700
                               text-white
                               flex items-center
                               justify-center
                               transition"
                    >

                        <i class="fa-solid fa-arrow-up"></i>

                    </button>

                </div>


                <p
                    class="text-center
                           text-[10px]
                           sm:text-xs
                           text-gray-400
                           mt-2 sm:mt-3
                           px-2"
                >
                    Aivora can make mistakes.
                    Verify important information.
                </p>

            </div>

        </footer>

    </main>

</div>


<script>

const messageInput =
    document.getElementById("messageInput");

const messages =
    document.getElementById("messages");

const welcomeScreen =
    document.getElementById("welcomeScreen");

const chatContainer =
    document.getElementById("chatContainer");

const sendButton =
    document.getElementById("sendButton");

const sidebar =
    document.getElementById("sidebar");

const sidebarOverlay =
    document.getElementById("sidebarOverlay");


// ================= SEND MESSAGE =================

async function sendMessage() {

    const userInput =
        messageInput.value.trim();

    if (!userInput) return;


    welcomeScreen.classList.add("hidden");

    messages.classList.remove("hidden");


    addMessage(userInput, "user");


    messageInput.value = "";

    autoResize();


    sendButton.disabled = true;


    const typingId =
        showTyping();


    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: userInput
                })

            });


        if (!response.ok) {
            throw new Error("Server error");
        }


        const data =
            await response.json();


        removeTyping(typingId);


        addMessage(
            data.reply,
            "assistant"
        );

    }

    catch (error) {

        removeTyping(typingId);

        addMessage(
            "⚠️ Unable to connect to Aivora. Please check the server.",
            "assistant"
        );

        console.error(error);

    }

    finally {

        sendButton.disabled = false;

        messageInput.focus();

    }

}


// ================= ADD MESSAGE =================

function addMessage(text, sender) {

    const wrapper =
        document.createElement("div");


    wrapper.className =
        sender === "user"
        ? "flex justify-end"
        : "flex justify-start";


    if (sender === "user") {

        wrapper.innerHTML = `

            <div class="flex items-start gap-2 sm:gap-3
                        max-w-[92%] sm:max-w-[85%]">

                <div
                    class="bg-blue-600
                           text-white
                           rounded-2xl
                           rounded-tr-md
                           px-4 sm:px-5
                           py-3
                           shadow-sm
                           overflow-hidden"
                >

                    <p class="whitespace-pre-wrap
                              break-words
                              text-sm sm:text-base">
                        ${escapeHTML(text)}
                    </p>

                </div>


                <div
                    class="w-8 h-8 sm:w-9 sm:h-9
                           shrink-0
                           rounded-full
                           bg-gray-700
                           text-white
                           flex items-center
                           justify-center"
                >

                    <i class="fa-solid fa-user text-xs sm:text-sm"></i>

                </div>

            </div>
        `;

    }

    else {

        wrapper.innerHTML = `

            <div class="flex items-start
                        gap-2 sm:gap-3
                        max-w-[96%] sm:max-w-[90%]">

                <div
                    class="w-8 h-8 sm:w-9 sm:h-9
                           shrink-0
                           rounded-full
                           bg-blue-600
                           text-white
                           flex items-center
                           justify-center"
                >

                    <i class="fa-solid fa-robot text-xs sm:text-sm"></i>

                </div>


                <div
                    class="bg-white
                           dark:bg-gray-900
                           border
                           border-gray-200
                           dark:border-gray-800
                           rounded-2xl
                           rounded-tl-md
                           px-4 sm:px-5
                           py-3
                           shadow-sm
                           min-w-0
                           overflow-hidden"
                >

                    <p
                        class="text-gray-800
                               dark:text-gray-200
                               whitespace-pre-wrap
                               break-words
                               text-sm sm:text-base"
                    >
                        ${escapeHTML(text)}
                    </p>


                    <div class="mt-3 flex gap-2">

                        <button
                            onclick="copyMessage(this)"
                            class="text-gray-400
                                   hover:text-blue-500
                                   text-xs"
                        >

                            <i class="fa-regular fa-copy"></i>
                            Copy

                        </button>

                    </div>

                </div>

            </div>
        `;

    }


    messages.appendChild(wrapper);

    scrollToBottom();

}


// ================= TYPING =================

function showTyping() {

    const id =
        "typing-" + Date.now();


    const wrapper =
        document.createElement("div");


    wrapper.id = id;

    wrapper.className =
        "flex justify-start";


    wrapper.innerHTML = `

        <div class="flex items-start gap-2 sm:gap-3">

            <div
                class="w-8 h-8 sm:w-9 sm:h-9
                       rounded-full
                       bg-blue-600
                       text-white
                       flex items-center
                       justify-center"
            >

                <i class="fa-solid fa-robot text-xs"></i>

            </div>


            <div
                class="bg-white
                       dark:bg-gray-900
                       border
                       border-gray-200
                       dark:border-gray-800
                       rounded-2xl
                       rounded-tl-md
                       px-5 py-4"
            >

                <div class="flex gap-1">

                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>

                </div>

            </div>

        </div>

    `;


    messages.appendChild(wrapper);

    scrollToBottom();

    return id;

}


function removeTyping(id) {

    const element =
        document.getElementById(id);

    if (element) {
        element.remove();
    }

}


// ================= COPY =================

function copyMessage(button) {

    const container =
        button.closest(
            ".bg-white, .dark\\:bg-gray-900"
        );


    const message =
        container.querySelector("p").innerText;


    navigator.clipboard.writeText(message);


    button.innerHTML =
        '<i class="fa-solid fa-check"></i> Copied';


    setTimeout(() => {

        button.innerHTML =
            '<i class="fa-regular fa-copy"></i> Copy';

    }, 1500);

}


// ================= CLEAR =================

function clearChat() {

    messages.innerHTML = "";

    messages.classList.add("hidden");

    welcomeScreen.classList.remove("hidden");

    messageInput.value = "";

    messageInput.focus();

}


// ================= SUGGESTION =================

function useSuggestion(text) {

    messageInput.value = text;

    closeSidebarOnMobile();

    sendMessage();

}


// ================= THEME =================

function toggleTheme() {

    document.documentElement
        .classList.toggle("dark");


    const isDark =
        document.documentElement
        .classList.contains("dark");


    localStorage.setItem(
        "darkMode",
        isDark
    );


    updateThemeButton();

}


function updateThemeButton() {

    const isDark =
        document.documentElement
        .classList.contains("dark");


    const icon =
        document.getElementById("themeIcon");


    const text =
        document.getElementById("themeText");


    if (isDark) {

        icon.className =
            "fa-solid fa-sun";

        text.innerText =
            "Light Mode";

    }

    else {

        icon.className =
            "fa-solid fa-moon";

        text.innerText =
            "Dark Mode";

    }

}


if (
    localStorage.getItem("darkMode")
    === "true"
) {

    document.documentElement
        .classList.add("dark");

}


updateThemeButton();


// ================= SIDEBAR =================

function toggleSidebar() {

    sidebar.classList.toggle(
        "-translate-x-full"
    );

    sidebarOverlay.classList.toggle(
        "hidden"
    );

}


function closeSidebarOnMobile() {

    if (
        window.innerWidth < 1024
    ) {

        sidebar.classList.add(
            "-translate-x-full"
        );

        sidebarOverlay.classList.add(
            "hidden"
        );

    }

}


// ================= ENTER =================

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
            && !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// ================= AUTO RESIZE =================

messageInput.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    messageInput.style.height =
        "auto";


    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            160
        ) + "px";

}


// ================= SCROLL =================

function scrollToBottom() {

    setTimeout(() => {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    }, 50);

}


// ================= ESCAPE HTML =================

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>


<style>

.suggestion {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px;

    border: 1px solid rgb(229 231 235);

    border-radius: 12px;

    text-align: left;

    color: rgb(55 65 81);

    background: white;

    transition: 0.2s;

}


.suggestion:hover {

    border-color: rgb(59 130 246);

    transform: translateY(-2px);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.08);

}


.dark .suggestion {

    background: rgb(17 24 39);

    border-color: rgb(55 65 81);

    color: rgb(209 213 219);

}


.typing-dot {

    width: 7px;

    height: 7px;

    background: #9ca3af;

    border-radius: 50%;

    animation:
        typing 1.4s
        infinite
        ease-in-out;

}


.typing-dot:nth-child(2) {

    animation-delay: 0.2s;

}


.typing-dot:nth-child(3) {

    animation-delay: 0.4s;

}


@keyframes typing {

    0%, 60%, 100% {

        transform:
            translateY(0);

        opacity: 0.4;

    }

    30% {

        transform:
            translateY(-5px);

        opacity: 1;

    }

}


/* Prevent horizontal overflow */

html,
body {

    max-width: 100%;

    overflow-x: hidden;

}


/* Better mobile scrollbar */

::-webkit-scrollbar {

    width: 5px;

}


::-webkit-scrollbar-thumb {

    background: #9ca3af;

    border-radius: 10px;

}

</style>

</body>
</html>

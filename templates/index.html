<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Aivora — AI Assistant</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script>
        tailwind.config = {
            darkMode: "class"
        };
    </script>

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        button,
        textarea {
            font-family: inherit;
        }

        /* Prevent horizontal scrolling */
        html,
        body,
        #app {
            max-width: 100%;
        }


        /* =========================================================
           APP LAYOUT
        ========================================================= */

        #app {
            display: flex;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        #sidebar {
            width: 288px;
            min-width: 288px;
            height: 100dvh;

            background: white;
            border-right: 1px solid rgb(229 231 235);

            display: flex;
            flex-direction: column;

            position: relative;
            z-index: 50;

            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .dark #sidebar {
            background: rgb(17 24 39);
            border-color: rgb(31 41 55);
        }


        /* =========================================================
           OVERLAY
        ========================================================= */

        #sidebarOverlay {
            display: none;
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.5);

            z-index: 40;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        #mainContent {
            flex: 1;
            min-width: 0;
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        #topHeader {
            height: 64px;
            min-height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: white;
            border-bottom: 1px solid rgb(229 231 235);
        }

        .dark #topHeader {
            background: rgb(17 24 39);
            border-color: rgb(31 41 55);
        }


        /* =========================================================
           CHAT AREA
        ========================================================= */

        #chatContainer {
            flex: 1;
            min-height: 0;
            width: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 24px 20px;

            scroll-behavior: smooth;
        }


        /* =========================================================
           WELCOME SCREEN
        ========================================================= */

        #welcomeScreen {
            width: 100%;
            max-width: 760px;

            min-height: 100%;

            margin: auto;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px 10px;
        }


        /* =========================================================
           SUGGESTIONS
        ========================================================= */

        #suggestions {
            width: 100%;
            max-width: 620px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 12px;
            margin-top: 28px;
        }

        .suggestion {
            width: 100%;
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 14px;

            border: 1px solid rgb(229 231 235);
            border-radius: 12px;

            text-align: left;

            color: rgb(55 65 81);
            background: white;

            transition: all 0.2s ease;

            cursor: pointer;
        }

        .suggestion:hover {
            border-color: rgb(59 130 246);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .dark .suggestion {
            background: rgb(17 24 39);
            border-color: rgb(55 65 81);
            color: rgb(209 213 219);
        }

        .suggestion i {
            flex-shrink: 0;
        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        #messages {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        .message-row {
            width: 100%;
            min-width: 0;

            display: flex;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 88%;
            min-width: 0;

            display: flex;
            align-items: flex-start;

            gap: 10px;
        }

        .message-row.user .message-content {
            flex-direction: row-reverse;
        }

        .message-bubble {
            min-width: 0;
            max-width: 100%;

            padding: 12px 16px;

            border-radius: 16px;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .user-bubble {
            background: rgb(37 99 235);
            color: white;
            border-top-right-radius: 5px;
        }

        .assistant-bubble {
            background: white;
            color: rgb(31 41 55);

            border: 1px solid rgb(229 231 235);

            border-top-left-radius: 5px;
        }

        .dark .assistant-bubble {
            background: rgb(17 24 39);
            color: rgb(229 231 235);
            border-color: rgb(31 41 55);
        }

        .avatar {
            width: 36px;
            height: 36px;

            min-width: 36px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
        }

        .user-avatar {
            background: rgb(55 65 81);
        }

        .assistant-avatar {
            background: rgb(37 99 235);
        }


        /* =========================================================
           INPUT AREA
        ========================================================= */

        #inputFooter {
            flex-shrink: 0;

            width: 100%;

            padding: 12px 20px 16px;

            background: rgb(243 244 246);
        }

        .dark #inputFooter {
            background: rgb(3 7 18);
        }

        #inputWrapper {
            width: 100%;
            max-width: 900px;

            margin: auto;
        }

        #inputBox {
            width: 100%;

            position: relative;

            background: white;

            border: 1px solid rgb(209 213 219);

            border-radius: 16px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);

            transition: border 0.2s ease;
        }

        .dark #inputBox {
            background: rgb(17 24 39);
            border-color: rgb(55 65 81);
        }

        #inputBox:focus-within {
            border-color: rgb(59 130 246);
        }

        #messageInput {
            display: block;

            width: 100%;

            min-height: 52px;
            max-height: 160px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: rgb(17 24 39);

            padding: 14px 58px 14px 16px;

            font-size: 16px;

            line-height: 1.5;
        }

        .dark #messageInput {
            color: white;
        }

        #messageInput::placeholder {
            color: rgb(156 163 175);
        }

        #sendButton {
            position: absolute;

            right: 7px;
            bottom: 7px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 11px;

            background: rgb(37 99 235);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        #sendButton:hover {
            background: rgb(29 78 216);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* =========================================================
           TYPING DOTS
        ========================================================= */

        .typing-dot {
            width: 7px;
            height: 7px;

            background: #9ca3af;

            border-radius: 50%;

            animation:
                typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }


        /* =========================================================
           SCROLLBAR
        ========================================================= */

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 10px;
        }


        /* =========================================================
           MOBILE — <= 1023px
        ========================================================= */

        @media (max-width: 1023px) {

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #app {
                width: 100%;
                height: 100dvh;
                overflow: hidden;
            }


            /* -------------------------
               SIDEBAR
            ------------------------- */

            #sidebar {
                position: fixed;

                top: 0;
                left: 0;
                bottom: 0;

                width: min(288px, 85vw);
                min-width: 0;

                height: 100dvh;

                z-index: 50;

                transform: translateX(-100%);

                transition:
                    transform 0.3s ease-in-out;

                box-shadow: 8px 0 30px rgba(0, 0, 0, 0.12);
            }

            #sidebar.mobile-open {
                transform: translateX(0);
            }


            /* -------------------------
               OVERLAY
            ------------------------- */

            #sidebarOverlay {
                display: none;
            }

            #sidebarOverlay.mobile-visible {
                display: block;
            }


            /* -------------------------
               MAIN
            ------------------------- */

            #mainContent {
                width: 100%;
                min-width: 0;
                height: 100dvh;
            }


            /* -------------------------
               HEADER
            ------------------------- */

            #topHeader {
                height: 60px;
                min-height: 60px;

                padding: 0 10px;
            }


            /* -------------------------
               CHAT
            ------------------------- */

            #chatContainer {
                width: 100%;

                padding: 15px 10px;

                overflow-x: hidden;
            }


            /* -------------------------
               WELCOME
            ------------------------- */

            #welcomeScreen {
                width: 100%;
                max-width: 100%;

                padding: 20px 5px;
            }

            #welcomeScreen h1 {
                font-size: 1.65rem;
                line-height: 1.25;
            }

            #welcomeScreen p {
                max-width: 95%;
            }


            /* -------------------------
               SUGGESTIONS
            ------------------------- */

            #suggestions {
                grid-template-columns: 1fr;

                width: 100%;
                max-width: 520px;

                gap: 10px;

                margin-top: 22px;
            }

            .suggestion {
                padding: 13px;

                font-size: 14px;
            }


            /* -------------------------
               MESSAGES
            ------------------------- */

            #messages {
                width: 100%;
                max-width: 100%;

                gap: 15px;
            }

            .message-content {
                max-width: calc(100vw - 50px);
            }

            .message-bubble {
                max-width: 100%;

                padding: 11px 13px;

                font-size: 14px;
            }

            .avatar {
                width: 32px;
                height: 32px;

                min-width: 32px;
            }


            /* -------------------------
               INPUT
            ------------------------- */

            #inputFooter {
                width: 100%;

                padding: 7px 8px 9px;
            }

            #inputWrapper {
                width: 100%;
                max-width: 100%;
            }

            #messageInput {
                min-height: 50px;

                font-size: 16px;

                padding:
                    13px
                    54px
                    13px
                    14px;
            }


            /* -------------------------
               DISCLAIMER
            ------------------------- */

            #inputFooter p {
                margin-top: 6px;

                font-size: 9px;
            }

        }


        /* =========================================================
           SMALL PHONES — <= 480px
        ========================================================= */

        @media (max-width: 480px) {

            #topHeader {
                height: 58px;
                min-height: 58px;
            }

            #chatContainer {
                padding: 10px 7px;
            }

            #welcomeScreen {
                padding:
                    15px
                    3px;
            }

            #welcomeScreen h1 {
                font-size: 1.45rem;
            }

            #welcomeScreen p {
                font-size: 13px;
            }


            /* Robot icon */

            #welcomeIcon {
                width: 64px;
                height: 64px;

                margin-bottom: 18px;
            }

            #welcomeIcon i {
                font-size: 1.8rem;
            }


            /* Suggestions */

            #suggestions {
                gap: 8px;
            }

            .suggestion {
                padding: 11px;

                border-radius: 10px;
            }


            /* Messages */

            .message-content {
                max-width: calc(100vw - 45px);

                gap: 7px;
            }

            .message-bubble {
                padding: 10px 12px;

                font-size: 14px;

                border-radius: 14px;
            }

            .avatar {
                width: 30px;
                height: 30px;

                min-width: 30px;
            }


            /* Input */

            #inputFooter {
                padding:
                    5px
                    6px
                    7px;
            }

            #messageInput {
                min-height: 48px;

                padding:
                    12px
                    52px
                    12px
                    12px;
            }

            #sendButton {
                width: 38px;
                height: 38px;

                right: 5px;
                bottom: 5px;
            }

        }


        /* =========================================================
           VERY SMALL PHONES — <= 360px
        ========================================================= */

        @media (max-width: 360px) {

            #welcomeScreen h1 {
                font-size: 1.3rem;
            }

            #welcomeScreen p {
                font-size: 12px;
            }

            .suggestion {
                font-size: 13px;
            }

            .message-bubble {
                font-size: 13px;
            }

            #messageInput {
                font-size: 16px;
            }

        }


        /* =========================================================
           DESKTOP — >= 1024px
        ========================================================= */

        @media (min-width: 1024px) {

            #sidebar {
                position: relative;

                transform: translateX(0);

                width: 288px;
                min-width: 288px;
            }

            #sidebarOverlay {
                display: none !important;
            }

            #mobileMenuButton {
                display: none;
            }

        }


        /* =========================================================
           DARK MODE
        ========================================================= */

        .dark .assistant-bubble {
            background: rgb(17 24 39);
        }


        /* =========================================================
           SAFE MEDIA ELEMENTS
        ========================================================= */

        img,
        video,
        canvas,
        iframe {
            max-width: 100%;
        }

    </style>

</head>


<body class="bg-gray-100 dark:bg-gray-950 transition-colors duration-300">

<div id="app">


    <!-- =========================================================
         MOBILE OVERLAY
    ========================================================= -->

    <div
        id="sidebarOverlay"
        onclick="closeSidebar()"
    ></div>


    <!-- =========================================================
         SIDEBAR
    ========================================================= -->

    <aside id="sidebar">


        <!-- Logo -->

        <div class="p-5 border-b border-gray-200 dark:border-gray-800">

            <div class="flex items-center justify-between">

                <div class="flex items-center gap-3">

                    <div
                        class="w-11 h-11 rounded-xl
                               bg-blue-600 text-white
                               flex items-center justify-center
                               shadow-lg"
                    >
                        <i class="fa-solid fa-robot text-xl"></i>
                    </div>

                    <div>

                        <h1
                            class="font-bold text-lg
                                   text-gray-900 dark:text-white"
                        >
                            Aivora
                        </h1>

                        <p class="text-xs text-gray-500">
                            AI Assistant
                        </p>

                    </div>

                </div>


                <!-- Mobile close -->

                <button
                    onclick="closeSidebar()"
                    class="lg:hidden w-9 h-9
                           rounded-lg
                           hover:bg-gray-100

                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

        </div>


        <!-- New Chat -->

        <div class="p-4">

            <button
                onclick="clearChat(); closeSidebar()"

                       transition shadow-md"

        </div>

            <p

                       text-gray-400 uppercase mb-3"
            >
                Recent Chats
            </p>


            <button
                class="w-full text-left p-3 rounded-lg
                       hover:bg-gray-100
                       dark:hover:bg-gray-800
                       text-gray-700
                       dark:text-gray-300
                       text-sm
                       flex items-center gap-3"
            >

                <i class="fa-regular fa-message"></i>

                Current Conversation

        <!-- Bottom -->

        <div
            class="p-4

                   dark:border-gray-800"
        >

            <button

                class="w-full flex items-center gap-3
                       p-3 rounded-lg
                       hover:bg-gray-100
                       dark:hover:bg-gray-800
                       text-gray-700

            >

                <i
                    id="themeIcon"
                    class="fa-solid fa-moon"
                ></i>

                <span id="themeText">
                    Dark Mode
                </span>

            </button>

        </div>

    </aside>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================= -->

    <main id="mainContent">


        <!-- =====================================================
             HEADER
        ===================================================== -->

        <header id="topHeader">


            <div class="flex items-center gap-3">


                <!-- Mobile menu -->

                <button
                    id="mobileMenuButton"
                    onclick="toggleSidebar()"
                    class="lg:hidden
                           w-10 h-10
                           rounded-lg
                           hover:bg-gray-100
                           dark:hover:bg-gray-800
                           text-gray-600
                           dark:text-gray-300
                           flex items-center justify-center"
                >

                    <i class="fa-solid fa-bars text-xl"></i>

                </button>


                <div>

                    <h2
                        class="font-semibold
                               text-gray-900
                               dark:text-white"
                    >
                        Aivora
                    </h2>


                    <div class="flex items-center gap-2">

                        <span

                                   bg-green-500
                                   rounded-full"
                        ></span>

                        <span class="text-xs text-gray-500">

                        </span>

                    </div>

                </div>

            </div>


            <!-- Clear -->

            <button
                onclick="clearChat()"
                title="Clear chat"
                class="w-10 h-10
                       rounded-lg
                       hover:bg-gray-100
                       dark:hover:bg-gray-800
                       text-gray-600
                       dark:text-gray-300
                       flex items-center justify-center"
            >

                <i class="fa-solid fa-trash"></i>

            </button>

        </header>


        <!-- =====================================================
             CHAT AREA
        ===================================================== -->

        <section id="chatContainer">


            <!-- Welcome -->

            <div
                id="welcomeScreen"
            >

                <!-- Robot -->

                <div
                    id="welcomeIcon"
                    class="w-20 h-20

                           bg-blue-600
                           text-white
                           flex items-center
                           justify-center

                >

                        class="fa-solid fa-robot

                <h1

                </h1>


                <p
                    class="text-sm
                           sm:text-base
                           text-gray-500
                           dark:text-gray-400
                           max-w-lg
                           px-3"
                >
                    Ask me anything. I can help you with
                    coding, learning, ideas, explanations
                    and much more.
                </p>


                <!-- Suggestions -->

                <div id="suggestions">


                    <button
                        onclick="useSuggestion('Explain Python functions')"
                        class="suggestion"
                    >

                        <i class="fa-solid fa-code"></i>

                        <span>
                            Explain Python functions
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Give me a coding challenge')"
                        class="suggestion"
                    >

                        <i class="fa-solid fa-terminal"></i>

                        <span>
                            Give me a coding challenge
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Explain artificial intelligence')"
                        class="suggestion"
                    >

                        <i class="fa-solid fa-brain"></i>

                        <span>
                            Explain AI
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Help me build a project')"
                        class="suggestion"
                    >

                        <i class="fa-solid fa-lightbulb"></i>

                        <span>
                            Help me build a project
                        </span>

                    </button>


                </div>

            </div>


            <!-- Messages -->

            <div
                id="messages"
                class="hidden"
            ></div>


        </section>


        <!-- =====================================================
             INPUT
        ===================================================== -->

        <footer id="inputFooter">


            <div id="inputWrapper">


                <div id="inputBox">


                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message Aivora..."
                        autocomplete="off"
                    ></textarea>


                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >

                        <i class="fa-solid fa-arrow-up"></i>

                    </button>


                </div>


                <p
                    class="text-center
                           text-[10px]
                           sm:text-xs
                           text-gray-400
                           mt-2"

                    Aivora can make mistakes.
                    Verify important information.
                </p>


            </div>

        </footer>


    </main>

</div>


<!-- =============================================================
     JAVASCRIPT
============================================================= -->

<script>


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    const chatContainer =
        document.getElementById("chatContainer");

    const sendButton =
        document.getElementById("sendButton");

    const sidebar =
        document.getElementById("sidebar");

    const sidebarOverlay =
        document.getElementById("sidebarOverlay");


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        const userInput =
            messageInput.value.trim();

        if (!userInput) return;


        welcomeScreen.classList.add("hidden");

        messages.classList.remove("hidden");


        addMessage(
            userInput,
            "user"
        );


        messageInput.value = "";

        autoResize();


        sendButton.disabled = true;


        const typingId =
            showTyping();


        try {

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: userInput
                    })

                });


            if (!response.ok) {
                throw new Error(
                    "Server error"
                );
            }


            const data =
                await response.json();


            removeTyping(
                typingId
            );


            addMessage(
                data.reply,
                "assistant"
            );

        }


        catch (error) {

            removeTyping(
                typingId
            );


            addMessage(
                "⚠️ Unable to connect to Aivora. Please check the server.",
                "assistant"
            );


            console.error(error);

        }


        finally {

            sendButton.disabled = false;

            messageInput.focus();

        }

    }


    /* =========================================================
       ADD MESSAGE
    ========================================================= */

    function addMessage(text, sender) {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message-row " +
            (
                sender === "user"
                    ? "user"
                    : "assistant"
            );


        if (sender === "user") {

            wrapper.innerHTML = `

                <div class="message-content">

                    <div class="message-bubble user-bubble">

                        <p class="whitespace-pre-wrap">
                            ${escapeHTML(text)}
                        </p>

                    </div>


                    <div class="avatar user-avatar">

                        <i class="fa-solid fa-user"></i>

                    </div>

                </div>

            `;

        }


        else {

            wrapper.innerHTML = `

                <div class="message-content">

                    <div class="avatar assistant-avatar">

                        <i class="fa-solid fa-robot"></i>

                    </div>


                    <div class="message-bubble assistant-bubble">

                        <p class="whitespace-pre-wrap">
                            ${escapeHTML(text)}
                        </p>


                        <div class="mt-3 flex gap-2">

                            <button
                                onclick="copyMessage(this)"
                                class="text-gray-400
                                       hover:text-blue-500
                                       text-xs"
                            >

                                <i class="fa-regular fa-copy"></i>
                                Copy

                            </button>

                        </div>

                    </div>

                </div>

            `;

        }


        messages.appendChild(
            wrapper
        );


        scrollToBottom();

    }


    /* =========================================================
       TYPING
    ========================================================= */

    function showTyping() {

        const id =
            "typing-" + Date.now();


        const wrapper =
            document.createElement("div");


        wrapper.id = id;

        wrapper.className =
            "message-row assistant";


        wrapper.innerHTML = `

            <div class="message-content">

                <div class="avatar assistant-avatar">

                    <i class="fa-solid fa-robot"></i>

                </div>


                <div
                    class="message-bubble
                           assistant-bubble"
                >

                    <div class="flex gap-1">

                        <span class="typing-dot"></span>

                        <span class="typing-dot"></span>

                        <span class="typing-dot"></span>

                    </div>

                </div>

            </div>

        `;


        messages.appendChild(
            wrapper
        );


        scrollToBottom();


        return id;

    }


    function removeTyping(id) {

        const element =
            document.getElementById(id);


        if (element) {
            element.remove();
        }

    }


    /* =========================================================
       COPY MESSAGE
    ========================================================= */

    function copyMessage(button) {

        const bubble =
            button.closest(
                ".assistant-bubble"
            );


        if (!bubble) return;


        const message =
            bubble.querySelector(
                "p"
            ).innerText;


        navigator.clipboard.writeText(
            message
        );


        button.innerHTML =
            '<i class="fa-solid fa-check"></i> Copied';


        setTimeout(() => {

            button.innerHTML =
                '<i class="fa-regular fa-copy"></i> Copy';

        }, 1500);

    }


    /* =========================================================
       CLEAR CHAT
    ========================================================= */

    function clearChat() {

        messages.innerHTML = "";

        messages.classList.add(
            "hidden"
        );

        welcomeScreen.classList.remove(
            "hidden"
        );

        messageInput.value = "";

        autoResize();

        messageInput.focus();

    }


    /* =========================================================
       SUGGESTION
    ========================================================= */

    function useSuggestion(text) {

        messageInput.value = text;

        closeSidebar();

        sendMessage();

    }


    /* =========================================================
       THEME
    ========================================================= */

    function toggleTheme() {

        document.documentElement
            .classList
            .toggle("dark");


        const isDark =
            document.documentElement
                .classList
                .contains("dark");


        localStorage.setItem(
            "darkMode",
            isDark
        );


        updateThemeButton();

    }


    function updateThemeButton() {

        const isDark =
            document.documentElement
                .classList
                .contains("dark");


        const icon =
            document.getElementById(
                "themeIcon"
            );


        const text =
            document.getElementById(
                "themeText"
            );


        if (isDark) {

            icon.className =
                "fa-solid fa-sun";

            text.innerText =
                "Light Mode";

        }

        else {

            icon.className =
                "fa-solid fa-moon";

            text.innerText =
                "Dark Mode";

        }

    }


    /* =========================================================
       LOAD THEME
    ========================================================= */

    if (
        localStorage.getItem(
            "darkMode"
        ) === "true"
    ) {

        document.documentElement
            .classList
            .add("dark");

    }


    updateThemeButton();


    /* =========================================================
       MOBILE SIDEBAR
    ========================================================= */

    function toggleSidebar() {

        if (
            sidebar.classList.contains(
                "mobile-open"
            )
        ) {

            closeSidebar();

        }

        else {

            sidebar.classList.add(
                "mobile-open"
            );

            sidebarOverlay.classList.add(
                "mobile-visible"
            );

            document.body.style.overflow =
                "hidden";

        }

    }


    function closeSidebar() {

        sidebar.classList.remove(
            "mobile-open"
        );

        sidebarOverlay.classList.remove(
            "mobile-visible"
        );

        document.body.style.overflow =
            "";

    }


    function closeSidebarOnMobile() {

        if (
            window.innerWidth < 1024
        ) {

            closeSidebar();

        }

    }


    /* =========================================================
       WINDOW RESIZE
    ========================================================= */

    window.addEventListener(
        "resize",
        function () {

            if (
                window.innerWidth >= 1024
            ) {

                closeSidebar();

            }

        }
    );


    /* =========================================================
       ENTER TO SEND
    ========================================================= */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================================
       AUTO RESIZE TEXTAREA
    ========================================================= */

    messageInput.addEventListener(
        "input",
        autoResize
    );


    function autoResize() {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                160
            ) + "px";

    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom() {

        setTimeout(() => {

            chatContainer.scrollTop =
                chatContainer.scrollHeight;

        }, 50);

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHTML(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


</script>

</body>

</html>
